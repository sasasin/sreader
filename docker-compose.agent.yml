services:
  maven:
    entrypoint:
      - sh
      - /usr/local/bin/agent-maven-entrypoint.sh
    volumes:
      - agent-workspace:/workspace
      - .:/source:ro
      - ./app/target:/agent-reports
      - ./scripts/agent-maven-entrypoint.sh:/usr/local/bin/agent-maven-entrypoint.sh:ro

volumes:
  agent-workspace:
