name: Actions lockfile

# Fails when .github/workflows/actions.lock is out of sync with the workflow
# files, or when a locked pin no longer verifies upstream in the action repo.

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-lockfile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Actions dependency lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned gh-actions-lock extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.0

      - name: Verify lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
