name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # renovate: datasource=docker depName=schemaspy/schemaspy
      SCHEMASPY_VERSION: 7.0.2
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: sreader
          POSTGRES_USER: sreader
          POSTGRES_PASSWORD: sreader
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sreader -d sreader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether to validate app container
        id: container_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            # master image creation is owned by publish-container.yml.
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          container_change=false
          while IFS= read -r changed_file; do
            case "$changed_file" in
              .dockerignore|docker-compose.yml|docker/app/*|pom.xml|app/pom.xml|.mvn/*)
                container_change=true
                break
                ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}...HEAD")

          echo "required=$container_change" >> "$GITHUB_OUTPUT"

      - name: Prepare PostgreSQL databases
        shell: bash
        env:
          PGPASSWORD: sreader
        run: |
          set -euo pipefail

          ready=false
          for i in {1..60}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U sreader -d sreader; then
              ready=true
              break
            fi
            sleep 2
          done

          if [[ "$ready" != true ]]; then
            echo "PostgreSQL service did not become ready" >&2
            exit 1
          fi

          psql -h 127.0.0.1 -p 5432 -U sreader -d sreader -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'sreadertest') THEN
                  CREATE ROLE sreadertest WITH LOGIN PASSWORD 'sreadertest';
              END IF;
          END
          $$;

          SELECT 'CREATE DATABASE sreadertest OWNER sreadertest'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'sreadertest')\gexec

          GRANT ALL PRIVILEGES ON DATABASE sreadertest TO sreadertest;
          SQL

      - name: Show PostgreSQL version
        env:
          PGPASSWORD: sreader
        run: psql -h 127.0.0.1 -p 5432 -U sreader -d sreader -c "SELECT version();"

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Regenerate jOOQ sources
        # Fresh PostgreSQL: Flyway migrate (initialize) then jOOQ generate (generate-sources).
        env:
          SREADER_JOOQ_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/sreader
          SREADER_JOOQ_JDBC_USERNAME: sreader
          SREADER_JOOQ_JDBC_PASSWORD: sreader
        run: >-
          mvn -B
          -Pgenerate-jooq
          -pl app
          -am
          generate-sources

      - name: Verify generated jOOQ sources are committed
        # Detect modified, deleted, and untracked generated files.
        run: |
          set -euo pipefail
          status="$(git status --porcelain -- app/src/generated/java)"
          if [[ -n "$status" ]]; then
            echo "::error::Generated jOOQ sources differ from the committed tree."
            echo "$status"
            git diff -- app/src/generated/java || true
            git ls-files --others --exclude-standard -- app/src/generated/java || true
            exit 1
          fi

      - name: Maven verify on GitHub Actions runner
        env:
          SREADER_JOOQ_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/sreader
          SREADER_JOOQ_JDBC_USERNAME: sreader
          SREADER_JOOQ_JDBC_PASSWORD: sreader
          SREADER_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sreadertest
          SREADER_DATASOURCE_USERNAME: sreadertest
          SREADER_DATASOURCE_PASSWORD: sreadertest
          SREADER_SCHEDULER_ENABLED: 'false'
        run: mvn -B -V clean verify

      # SchemaSpy must run after mvn clean verify so its output under app/target is not deleted.
      - name: Generate database schema documentation
        shell: bash
        run: |
          set -euo pipefail

          output_dir="${GITHUB_WORKSPACE}/app/target/site/schemaspy"
          rm -rf "$output_dir"
          mkdir -p "$output_dir"

          # Bind mounts retain the runner's ownership. Run SchemaSpy with the
          # runner UID/GID so the report directory stays least-privilege writable
          # without broadening its mode to 777.
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"

          echo "SchemaSpy image: schemaspy/schemaspy:${SCHEMASPY_VERSION}"
          echo "PostgreSQL target: 127.0.0.1:5432/sreader (schema: public)"
          echo "Output directory: ${output_dir}"
          echo "Options: -t pgsql11 -norows -noimplied -I flyway_schema_history -imageformat svg"

          set +e
          docker run --rm \
            --network host \
            --user "${runner_uid}:${runner_gid}" \
            --volume "${output_dir}:/output" \
            "schemaspy/schemaspy:${SCHEMASPY_VERSION}" \
            -t pgsql11 \
            -host 127.0.0.1 \
            -port 5432 \
            -db sreader \
            -s public \
            -u sreader \
            -p sreader \
            -norows \
            -noimplied \
            -I 'flyway_schema_history' \
            -imageformat svg \
            -desc "SReader database schema generated from ${GITHUB_SHA}"
          schemaspy_exit=$?
          set -e

          echo "SchemaSpy command exit code: ${schemaspy_exit}"
          echo "Generated file count: $(find "$output_dir" -type f | wc -l)"
          echo "Generated files overview (first 50):"
          find "$output_dir" -type f | sort | head -50 || true

          if [[ "$schemaspy_exit" -ne 0 ]]; then
            echo "::error::SchemaSpy failed with exit code ${schemaspy_exit}"
            exit "$schemaspy_exit"
          fi

      - name: Validate SchemaSpy report
        shell: bash
        run: |
          set -euo pipefail

          schema_dir="app/target/site/schemaspy"
          index_file="${schema_dir}/index.html"

          if [[ ! -s "$index_file" ]]; then
            echo "::error file=${index_file}::SchemaSpy index.html is missing or empty"
            exit 1
          fi

          # Prefer diagram SVGs (exclude font SVGs under bower/fonts).
          if ! find "$schema_dir" -type f -path '*/diagrams/*' -name '*.svg' -size +0c -print -quit | grep -q .; then
            echo "::error file=${schema_dir}::SchemaSpy SVG diagram was not generated"
            exit 1
          fi

          if find "$schema_dir" -type l -print -quit | grep -q .; then
            echo "::error file=${schema_dir}::SchemaSpy output must not contain symbolic links"
            exit 1
          fi

          # SchemaSpy writes one HTML page per application table under tables/.
          # Fail only when flyway_schema_history is emitted as a table page.
          if [[ -e "${schema_dir}/tables/flyway_schema_history.html" ]]; then
            echo "::error file=${schema_dir}/tables/flyway_schema_history.html::flyway_schema_history must be excluded from SchemaSpy report"
            exit 1
          fi

          if find "${schema_dir}/tables" -type f -name 'flyway_schema_history*' -print -quit 2>/dev/null | grep -q .; then
            echo "::error file=${schema_dir}/tables::flyway_schema_history must be excluded from SchemaSpy report"
            exit 1
          fi

          echo "SchemaSpy report validation passed"
          echo "SVG diagrams:"
          find "$schema_dir" -type f -path '*/diagrams/*' -name '*.svg' -size +0c | sort

      - name: Upload CI reports
        id: reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-reports-${{ github.sha }}
          path: |
            app/target/site/jacoco/
            app/target/site/schemaspy/
            app/target/surefire-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Add CI reports to job summary
        if: always()
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          set -uo pipefail

          csv="app/target/site/jacoco/jacoco.csv"
          schema_index="app/target/site/schemaspy/index.html"
          summary="$GITHUB_STEP_SUMMARY"
          table_file=""

          cleanup() {
            if [[ -n "$table_file" ]]; then
              rm -f "$table_file"
            fi
          }
          trap cleanup EXIT

          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          {
            echo "## CI reports"
            echo
            echo "- Commit: [\`${GITHUB_SHA}\`](${commit_url})"
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo
            echo "### JaCoCo coverage"
            echo
          } >> "$summary"

          if [[ ! -f "$csv" ]]; then
            echo "::warning file=${csv}::JaCoCo CSV report was not generated"
            echo "**Coverage summary unavailable:** JaCoCo CSV report was not generated. Review the Maven verify logs." >> "$summary"
          elif [[ ! -s "$csv" ]]; then
            echo "::warning file=${csv}::JaCoCo CSV report is empty"
            echo "**Coverage summary unavailable:** JaCoCo CSV report is empty." >> "$summary"
          else
            table_file="$(mktemp)"

            if awk -F, '
              function percentage(covered, missed, total) {
                total = covered + missed
                return total == 0 ? "n/a" : sprintf("%.2f%%", 100 * covered / total)
              }

              NR == 1 {
                if ($1 != "GROUP") invalid = 1
                if ($4 != "INSTRUCTION_MISSED") invalid = 1
                if ($5 != "INSTRUCTION_COVERED") invalid = 1
                if ($6 != "BRANCH_MISSED") invalid = 1
                if ($7 != "BRANCH_COVERED") invalid = 1
                if ($8 != "LINE_MISSED") invalid = 1
                if ($9 != "LINE_COVERED") invalid = 1
                if ($12 != "METHOD_MISSED") invalid = 1
                if ($13 != "METHOD_COVERED") invalid = 1

                if (invalid) exit

                header_seen = 1
                next
              }

              {
                if (NF < 13) {
                  invalid = 1
                  exit
                }

                if ($4 !~ /^[0-9]+$/) invalid = 1
                if ($5 !~ /^[0-9]+$/) invalid = 1
                if ($6 !~ /^[0-9]+$/) invalid = 1
                if ($7 !~ /^[0-9]+$/) invalid = 1
                if ($8 !~ /^[0-9]+$/) invalid = 1
                if ($9 !~ /^[0-9]+$/) invalid = 1
                if ($12 !~ /^[0-9]+$/) invalid = 1
                if ($13 !~ /^[0-9]+$/) invalid = 1

                if (invalid) exit

                instruction_missed += $4
                instruction_covered += $5
                branch_missed += $6
                branch_covered += $7
                line_missed += $8
                line_covered += $9
                method_missed += $12
                method_covered += $13
                data_rows++
              }

              END {
                if (invalid || !header_seen || data_rows == 0) {
                  exit 1
                }

                print "| Metric | Covered | Missed | Coverage |"
                print "|---|---:|---:|---:|"

                printf "| Instructions | %d | %d | %s |\n",
                  instruction_covered,
                  instruction_missed,
                  percentage(instruction_covered, instruction_missed)

                printf "| Branches | %d | %d | %s |\n",
                  branch_covered,
                  branch_missed,
                  percentage(branch_covered, branch_missed)

                printf "| Lines | %d | %d | %s |\n",
                  line_covered,
                  line_missed,
                  percentage(line_covered, line_missed)

                printf "| Methods | %d | %d | %s |\n",
                  method_covered,
                  method_missed,
                  percentage(method_covered, method_missed)
              }
            ' "$csv" > "$table_file"; then
              cat "$table_file" >> "$summary"
            else
              echo "::warning file=${csv}::Failed to parse JaCoCo CSV report"
              echo "**Coverage summary unavailable:** JaCoCo CSV report could not be parsed." >> "$summary"
            fi
          fi

          {
            echo
            echo "### Database schema (SchemaSpy)"
            echo
            if [[ -s "$schema_index" ]]; then
              echo "- SchemaSpy HTML report generated under \`app/target/site/schemaspy/\`"
              svg_count="$(find app/target/site/schemaspy -type f -path '*/diagrams/*' -name '*.svg' -size +0c 2>/dev/null | wc -l | tr -d ' ')"
              echo "- SVG diagrams: ${svg_count}"
            else
              echo "- SchemaSpy HTML report was not generated or is empty."
            fi
            echo
            if [[ -n "${ARTIFACT_URL:-}" ]]; then
              echo "- [Download CI reports (JaCoCo, SchemaSpy, Surefire)](${ARTIFACT_URL}) — retained for 14 days; GitHub sign-in required"
            else
              echo "- Full report artifact URL is unavailable. Check the artifact upload step."
            fi
          } >> "$summary"

      - name: Build app image
        if: steps.container_changes.outputs.required == 'true'
        run: docker build --tag sreader-app:ci --file docker/app/Dockerfile .

      - name: Start app smoke test
        if: steps.container_changes.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          docker run --detach --name sreader-app-ci --network host \
            --env SREADER_SCHEDULER_ENABLED=false \
            --env SREADER_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/sreader \
            --env SREADER_DATASOURCE_USERNAME=sreader \
            --env SREADER_DATASOURCE_PASSWORD=sreader \
            sreader-app:ci

          sleep 20

          if ! docker container inspect sreader-app-ci >/dev/null 2>&1; then
            echo "::error::app container was not created"
            docker ps -a
            docker logs --tail=200 sreader-app-ci 2>&1 || true
            exit 1
          fi

          if [ "$(docker inspect -f '{{.State.Running}}' sreader-app-ci)" != "true" ]; then
            echo "::error::app container is not running"
            docker ps -a
            docker logs --tail=200 sreader-app-ci 2>&1 || true
            exit 1
          fi

          docker logs --tail=200 sreader-app-ci

      - name: Assemble engineering reports site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail

          pages_dir="target/pages"
          jacoco_dir="app/target/site/jacoco"
          schemaspy_dir="app/target/site/schemaspy"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          rm -rf "$pages_dir"
          mkdir -p "$pages_dir/coverage" "$pages_dir/schema"

          cp -a "${jacoco_dir}/." "$pages_dir/coverage/"
          cp -a "${schemaspy_dir}/." "$pages_dir/schema/"

          cat > "$pages_dir/index.html" <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>SReader Engineering Reports</title>
          <style>
          :root { color-scheme: light dark; }
          body {
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            line-height: 1.5;
            margin: 2rem auto;
            max-width: 42rem;
            padding: 0 1rem;
          }
          h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
          p.lead { color: #555; margin-top: 0; }
          ul { padding-left: 1.25rem; }
          li { margin: 0.5rem 0; }
          code { font-size: 0.9em; }
          a { text-decoration: none; }
          a:hover { text-decoration: underline; }
          </style>
          </head>
          <body>
          <h1>SReader Engineering Reports</h1>
          <p class="lead">Generated by CI from the latest successful <code>master</code> build.</p>
          <ul>
          <li><a href="coverage/">Test Coverage</a> (JaCoCo HTML report)</li>
          <li><a href="schema/">Database Schema</a> (SchemaSpy ER diagram and table definitions)</li>
          <li><a href="${commit_url}">Source Commit</a> <code>${GITHUB_SHA}</code></li>
          </ul>
          </body>
          </html>
          EOF

          echo "Engineering reports site assembled under ${pages_dir}"
          find "$pages_dir" -maxdepth 2 -type f | sort | head -40

      - name: Validate engineering reports site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail

          pages_dir="target/pages"

          for index_file in \
            "${pages_dir}/index.html" \
            "${pages_dir}/coverage/index.html" \
            "${pages_dir}/schema/index.html"
          do
            if [[ ! -s "$index_file" ]]; then
              echo "::error file=${index_file}::Engineering reports site index is missing or empty"
              exit 1
            fi
          done

          if find "$pages_dir" -type l -print -quit | grep -q .; then
            echo "::error file=${pages_dir}::GitHub Pages artifact must not contain symbolic links"
            exit 1
          fi

          if ! find "${pages_dir}/schema" -type f -path '*/diagrams/*' -name '*.svg' -size +0c -print -quit | grep -q .; then
            echo "::error file=${pages_dir}/schema::SchemaSpy SVG diagram missing from Pages site"
            exit 1
          fi

          echo "Engineering reports site validation passed"

      - name: Upload engineering reports site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/pages

      - name: Show Docker status
        if: always() && steps.container_changes.outputs.required == 'true'
        run: docker ps -a

      - name: Show app logs
        if: always() && steps.container_changes.outputs.required == 'true'
        run: docker logs --tail=300 sreader-app-ci 2>&1 || true

      - name: Cleanup
        if: always() && steps.container_changes.outputs.required == 'true'
        run: docker rm --force sreader-app-ci 2>/dev/null || true

  deploy-coverage:
    name: Deploy engineering reports to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy engineering reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Add published reports URLs to job summary
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          # Normalize trailing slash so subpaths never double-slash.
          base_url="${PAGE_URL%/}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          {
            echo "## Published engineering reports"
            echo
            echo "- [Reports home](${base_url}/)"
            echo "- [JaCoCo coverage](${base_url}/coverage/)"
            echo "- [Database schema](${base_url}/schema/)"
            echo "- Source commit: [\`${GITHUB_SHA}\`](${commit_url})"
          } >> "$GITHUB_STEP_SUMMARY"
