name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: sreader
          POSTGRES_USER: sreader
          POSTGRES_PASSWORD: sreader
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sreader -d sreader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether to validate app container
        id: container_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            # master image creation is owned by publish-container.yml.
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          container_change=false
          while IFS= read -r changed_file; do
            case "$changed_file" in
              .dockerignore|docker-compose.yml|docker/app/*|pom.xml|app/pom.xml|.mvn/*)
                container_change=true
                break
                ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}...HEAD")

          echo "required=$container_change" >> "$GITHUB_OUTPUT"

      - name: Prepare PostgreSQL databases
        shell: bash
        env:
          PGPASSWORD: sreader
        run: |
          set -euo pipefail

          ready=false
          for i in {1..60}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U sreader -d sreader; then
              ready=true
              break
            fi
            sleep 2
          done

          if [[ "$ready" != true ]]; then
            echo "PostgreSQL service did not become ready" >&2
            exit 1
          fi

          psql -h 127.0.0.1 -p 5432 -U sreader -d sreader -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'sreadertest') THEN
                  CREATE ROLE sreadertest WITH LOGIN PASSWORD 'sreadertest';
              END IF;
          END
          $$;

          SELECT 'CREATE DATABASE sreadertest OWNER sreadertest'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'sreadertest')\gexec

          GRANT ALL PRIVILEGES ON DATABASE sreadertest TO sreadertest;
          SQL

      - name: Show PostgreSQL version
        env:
          PGPASSWORD: sreader
        run: psql -h 127.0.0.1 -p 5432 -U sreader -d sreader -c "SELECT version();"

      - name: Apply database migrations with Flyway
        # Integration tests need the migrated schema in PostgreSQL.
        run: >-
          docker run --rm --network host
          --volume "$GITHUB_WORKSPACE/db/migration:/flyway/migrations:ro"
          --env FLYWAY_URL=jdbc:postgresql://127.0.0.1:5432/sreader
          --env FLYWAY_USER=sreader
          --env FLYWAY_PASSWORD=sreader
          --env FLYWAY_LOCATIONS=filesystem:/flyway/migrations
          redgate/flyway:13.1.0 migrate

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Maven verify on GitHub Actions runner
        env:
          SREADER_JOOQ_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/sreader
          SREADER_JOOQ_JDBC_USERNAME: sreader
          SREADER_JOOQ_JDBC_PASSWORD: sreader
          SREADER_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sreadertest
          SREADER_DATASOURCE_USERNAME: sreadertest
          SREADER_DATASOURCE_PASSWORD: sreadertest
          SREADER_SCHEDULER_ENABLED: 'false'
        run: mvn -B -V clean verify

      - name: Upload test and coverage reports
        id: reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-and-coverage-${{ github.sha }}
          path: |
            app/target/site/jacoco/
            app/target/surefire-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Add coverage report to job summary
        if: always()
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          set -uo pipefail

          csv="app/target/site/jacoco/jacoco.csv"
          summary="$GITHUB_STEP_SUMMARY"
          table_file=""

          cleanup() {
            if [[ -n "$table_file" ]]; then
              rm -f "$table_file"
            fi
          }
          trap cleanup EXIT

          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          {
            echo "## JaCoCo coverage"
            echo
            echo "- Commit: [\`${GITHUB_SHA}\`](${commit_url})"
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo
          } >> "$summary"

          if [[ ! -f "$csv" ]]; then
            echo "::warning file=${csv}::JaCoCo CSV report was not generated"
            echo "**Coverage summary unavailable:** JaCoCo CSV report was not generated. Review the Maven verify logs." >> "$summary"
          elif [[ ! -s "$csv" ]]; then
            echo "::warning file=${csv}::JaCoCo CSV report is empty"
            echo "**Coverage summary unavailable:** JaCoCo CSV report is empty." >> "$summary"
          else
            table_file="$(mktemp)"

            if awk -F, '
              function percentage(covered, missed, total) {
                total = covered + missed
                return total == 0 ? "n/a" : sprintf("%.2f%%", 100 * covered / total)
              }

              NR == 1 {
                if ($1 != "GROUP") invalid = 1
                if ($4 != "INSTRUCTION_MISSED") invalid = 1
                if ($5 != "INSTRUCTION_COVERED") invalid = 1
                if ($6 != "BRANCH_MISSED") invalid = 1
                if ($7 != "BRANCH_COVERED") invalid = 1
                if ($8 != "LINE_MISSED") invalid = 1
                if ($9 != "LINE_COVERED") invalid = 1
                if ($12 != "METHOD_MISSED") invalid = 1
                if ($13 != "METHOD_COVERED") invalid = 1

                if (invalid) exit

                header_seen = 1
                next
              }

              {
                if (NF < 13) {
                  invalid = 1
                  exit
                }

                if ($4 !~ /^[0-9]+$/) invalid = 1
                if ($5 !~ /^[0-9]+$/) invalid = 1
                if ($6 !~ /^[0-9]+$/) invalid = 1
                if ($7 !~ /^[0-9]+$/) invalid = 1
                if ($8 !~ /^[0-9]+$/) invalid = 1
                if ($9 !~ /^[0-9]+$/) invalid = 1
                if ($12 !~ /^[0-9]+$/) invalid = 1
                if ($13 !~ /^[0-9]+$/) invalid = 1

                if (invalid) exit

                instruction_missed += $4
                instruction_covered += $5
                branch_missed += $6
                branch_covered += $7
                line_missed += $8
                line_covered += $9
                method_missed += $12
                method_covered += $13
                data_rows++
              }

              END {
                if (invalid || !header_seen || data_rows == 0) {
                  exit 1
                }

                print "| Metric | Covered | Missed | Coverage |"
                print "|---|---:|---:|---:|"

                printf "| Instructions | %d | %d | %s |\n",
                  instruction_covered,
                  instruction_missed,
                  percentage(instruction_covered, instruction_missed)

                printf "| Branches | %d | %d | %s |\n",
                  branch_covered,
                  branch_missed,
                  percentage(branch_covered, branch_missed)

                printf "| Lines | %d | %d | %s |\n",
                  line_covered,
                  line_missed,
                  percentage(line_covered, line_missed)

                printf "| Methods | %d | %d | %s |\n",
                  method_covered,
                  method_missed,
                  percentage(method_covered, method_missed)
              }
            ' "$csv" > "$table_file"; then
              cat "$table_file" >> "$summary"
            else
              echo "::warning file=${csv}::Failed to parse JaCoCo CSV report"
              echo "**Coverage summary unavailable:** JaCoCo CSV report could not be parsed." >> "$summary"
            fi
          fi

          {
            echo
            if [[ -n "${ARTIFACT_URL:-}" ]]; then
              echo "- [Download full JaCoCo and Surefire reports](${ARTIFACT_URL}) — retained for 14 days; GitHub sign-in required"
            else
              echo "- Full report artifact URL is unavailable. Check the artifact upload step."
            fi
          } >> "$summary"

      - name: Build app image
        if: steps.container_changes.outputs.required == 'true'
        run: docker build --tag sreader-app:ci --file docker/app/Dockerfile .

      - name: Start app smoke test
        if: steps.container_changes.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          docker run --detach --name sreader-app-ci --network host \
            --env SREADER_SCHEDULER_ENABLED=false \
            --env SREADER_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/sreader \
            --env SREADER_DATASOURCE_USERNAME=sreader \
            --env SREADER_DATASOURCE_PASSWORD=sreader \
            sreader-app:ci

          sleep 20

          if ! docker container inspect sreader-app-ci >/dev/null 2>&1; then
            echo "::error::app container was not created"
            docker ps -a
            docker logs --tail=200 sreader-app-ci 2>&1 || true
            exit 1
          fi

          if [ "$(docker inspect -f '{{.State.Running}}' sreader-app-ci)" != "true" ]; then
            echo "::error::app container is not running"
            docker ps -a
            docker logs --tail=200 sreader-app-ci 2>&1 || true
            exit 1
          fi

          docker logs --tail=200 sreader-app-ci

      - name: Validate coverage site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail

          report_dir="app/target/site/jacoco"
          index_file="${report_dir}/index.html"

          if [[ ! -s "$index_file" ]]; then
            echo "::error file=${index_file}::JaCoCo HTML report is missing or empty"
            exit 1
          fi

          if find "$report_dir" -type l -print -quit | grep -q .; then
            echo "::error file=${report_dir}::GitHub Pages artifact must not contain symbolic links"
            exit 1
          fi

      - name: Upload coverage site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/target/site/jacoco

      - name: Show Docker status
        if: always() && steps.container_changes.outputs.required == 'true'
        run: docker ps -a

      - name: Show app logs
        if: always() && steps.container_changes.outputs.required == 'true'
        run: docker logs --tail=300 sreader-app-ci 2>&1 || true

      - name: Cleanup
        if: always() && steps.container_changes.outputs.required == 'true'
        run: docker rm --force sreader-app-ci 2>/dev/null || true

  deploy-coverage:
    name: Deploy coverage report to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy coverage report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Add published coverage URL to job summary
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          {
            echo "## Published coverage report"
            echo
            echo "- [Open the latest JaCoCo HTML report](${PAGE_URL})"
            echo "- Source commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
